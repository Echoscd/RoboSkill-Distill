name: servo_to
kind: controller
description: Move one joint-controlled device to a fixed configuration, agent-free.
  Accepts joints in resolved model order, or a pose of kinematics.frame in the
  canonical device frame. Pose
  is passed to the device's IK driver once; the driver validates its solution with
  FK. Reads feedback and resubmits the fixed joint target until joint error and velocity
  stay within tolerance over fresh samples. Stops on every control-loop exit. Returns
  reached, terminated_by, final state and joint error. No Cartesian arrival, path
  planning, collision avoidance, balance or velocity-cap guarantee. Convert reference
  frames and tool offsets before calling.
parameters:
  type: object
  additionalProperties: false
  properties: &id001
    device:
      type: string
      description: joint-controlled device name
    joints:
      type: array
      items:
        type: number
      description: absolute configuration in resolved model joint order; radians or
        metres by joint type
    pose:
      type: array
      minItems: 7
      maxItems: 7
      items:
        type: number
      description: Pose [x,y,z,qx,qy,qz,qw] of kinematics.frame in the device canonical
        frame; requires declared IK.
    speedFraction:
      type: number
      exclusiveMinimum: 0
      maximum: 1
      description: Optional fraction of control.speed ceilings; requires speed support
    joint_tolerance:
      oneOf:
      - type: number
        exclusiveMinimum: 0
      - type: array
        items:
          type: number
          exclusiveMinimum: 0
        minItems: 1
      default: 0.01
      description: Scalar or per-joint values in model order; radians/metres
    quiet_velocity:
      oneOf:
      - type: number
        exclusiveMinimum: 0
      - type: array
        items:
          type: number
          exclusiveMinimum: 0
        minItems: 1
      default: 0.005
      description: Scalar or per-joint values in model order; radians/metres per second
    stable_s:
      type: number
      exclusiveMinimum: 0
      default: 0.1
      description: Stability window in the acquisition clock, or receipt clock when acquisition time is unavailable.
    timeout_s:
      type: number
      exclusiveMinimum: 0
      maximum: 110
      default: 30
      description: wall-clock budget
    max_steps:
      type: integer
      minimum: 1
      default: 1000
      description: observation/iteration budget
  required:
  - device
  oneOf:
  - type: object
    properties: *id001
    additionalProperties: false
    required:
    - device
    - joints
  - type: object
    properties: *id001
    additionalProperties: false
    required:
    - device
    - pose
timeout_s: 120
device_inputs:
  device:
    types:
    - joint
devices: []
