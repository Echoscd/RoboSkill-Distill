schema_version: 1
name: plan_top_down_parallel_place
version: 0.2.0
summary: >-
  Generate profile-aware, chained-IK top-down placement stages with bounded wrist-yaw search for an explicit world-frame object-center target.
usage:
  when_to_use:
    - Use when the current task and observation satisfy every field in tool.yaml.
  when_not_to_use:
    - Do not guess missing devices, frames, calibration, geometry, or measurements.
  prerequisites:
    - Read the concise contract in tool.yaml before constructing arguments.
  examples: []
parameters:
  arm:
    meaning: Arm holding the object.
    format: Loaded joint device ID string.
    unit: null
    frame: null
    source: Device inventory and verified grasp trace.
    constraints: [Must provide live state and IK.]
    do_not: [Do not use after a failed grasp.]
  gripper:
    meaning: Gripper holding the object.
    format: Loaded gripper device ID string.
    unit: null
    frame: null
    source: Device inventory and profile.
    constraints: [Must define TCP and legal release command.]
    do_not: [Do not guess release values.]
  target_object_center_world_m:
    meaning: Desired final center of the held object.
    format: Three finite numbers ordered [x, y, z].
    unit: m
    frame: world
    source: Support geometry combined with held-object dimensions.
    constraints: [The tool assumes object center coincides with the gripper TCP.]
    do_not: [Do not pass the support top point or arm flange target.]
  preplace_distance_m:
    meaning: Vertical clearance above final object center.
    format: Number in [0.03, 0.20].
    unit: m
    frame: world vertical
    source: Task clearance policy.
    constraints: [Must permit collision-free approach.]
    do_not: [Do not alter final placement height.]
  retreat_distance_m:
    meaning: Vertical retreat after release.
    format: Number in [0.03, 0.20].
    unit: m
    frame: world vertical
    source: Task clearance policy.
    constraints: [Must clear the placed object.]
    do_not: [Do not execute before release.]
returns:
  summary: TCP-compensated preplace, place, release, and retreat stages with selected wrist yaw and legal release command.
failure_handling:
  inspect_order: [tool.yaml, toolbook.yaml, tool.py]
  known_failures: []
  recovery:
    - Re-read the parameter descriptions and verify device IDs, units, and coordinate frames.
    - If the contract is satisfied but the call still fails, inspect the entrypoint and implementation source.
    - Record the failed call in failurebox before changing the tool.
source:
  entrypoint: tool.py
  implementation: [core.py]
  tests: []
