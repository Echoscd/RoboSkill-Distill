schema_version: 1
name: plan_held_bottle_transfer
version: 0.1.0
summary: >-
  Generate IK-checked lift and transfer targets for a bottle already held by a parallel-jaw gripper.
usage:
  when_to_use:
    - Use when the current task and observation satisfy every field in tool.yaml.
  when_not_to_use:
    - Do not guess missing devices, frames, calibration, geometry, or measurements.
  prerequisites:
    - Read the concise contract in tool.yaml before constructing arguments.
  examples: []
parameters:
  arm:
    meaning: Arm currently holding the verified object.
    format: Loaded joint device ID string.
    unit: null
    frame: null
    source: Successful grasp trace and device inventory.
    constraints: [Live arm state must still correspond to the verified grasp.]
    do_not: [Do not use after an unobserved motion or failed grasp.]
  gripper:
    meaning: Gripper that currently holds the verified object.
    format: Loaded gripper device ID string.
    unit: null
    frame: null
    source: Successful grasp verification and device inventory.
    constraints: [Must be mounted on arm and remain closed.]
    do_not: [Do not substitute another effector.]
  target_center_world_m:
    meaning: Desired final center of the held bottle.
    format: Three finite numbers ordered [x, y, z].
    unit: m
    frame: world
    source: Task target transformed through the calibrated frame graph.
    constraints: [Must describe the object center rather than arm flange or TCP.]
    do_not: [Do not pass camera coordinates or a support-surface point.]
  clearance_m:
    meaning: Vertical lift clearance before horizontal transfer.
    format: Number in [0.03, 0.15].
    unit: m
    frame: world vertical
    source: Obstacle and support geometry.
    constraints: [Must clear the source support and nearby obstacles.]
    do_not: [Do not treat as placement clearance.]
returns:
  summary: IK-checked lift and transfer flange targets that preserve live TCP orientation plus execution order and provenance.
failure_handling:
  inspect_order: [tool.yaml, toolbook.yaml, tool.py]
  known_failures: []
  recovery:
    - Re-read the parameter descriptions and verify device IDs, units, and coordinate frames.
    - If the contract is satisfied but the call still fails, inspect the entrypoint and implementation source.
    - Record the failed call in failurebox before changing the tool.
source:
  entrypoint: tool.py
  implementation: []
  tests: []
