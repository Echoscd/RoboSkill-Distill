name: plan_reachable_linear_contact
version: 0.2.1
title: Plan Reachable Linear Contact
kind: perception
description: >-
  Compatibility combo for a reachable linear contact plan. It first builds
  arm-independent approach/contact/press/retreat TCP variants, then calls the
  generic complete-sequence solver to select an arm, effector, and variant.
  It never executes motion.
  Nominal contact aligns the TCP origin, not a finger or pad. No aperture-dependent
  contact geometry is modeled; IK success does not establish physical contact.
parameters:
  type: object
  additionalProperties: false
  properties:
    arm_effector_pairs:
      type: array
      minItems: 1
      maxItems: 4
      items:
        type: object
        additionalProperties: false
        required: [arm, effector]
        properties:
          arm: {type: string, description: Loaded joint device ID.}
          effector: {type: string, description: Loaded effector mounted on that arm.}
    contact_point_world_m:
      type: array
      items: {type: number}
      minItems: 3
      maxItems: 3
      description: Target TCP-origin position [x,y,z] in world meters at nominal contact; not a calibrated finger-contact point.
    surface_outward_normal_world:
      type: array
      items: {type: number}
      minItems: 3
      maxItems: 3
      description: Geometric outward surface normal, not desired press direction.
    preferred_tangent_axis_world:
      type: array
      items: {type: number}
      minItems: 3
      maxItems: 3
      default: [1, 0, 0]
    approach_distance_m: {type: number, minimum: 0.03, maximum: 0.25, default: 0.10}
    press_distance_m: {type: number, minimum: 0.002, maximum: 0.08, default: 0.03}
    observation_id: {type: string, minLength: 1}
    observed_at_s: {type: number, minimum: 0}
    valid_for_s: {type: number, exclusiveMinimum: 0, maximum: 30, default: 5}
    position_uncertainty_m: {type: number, minimum: 0, maximum: 0.05}
  required:
    - arm_effector_pairs
    - contact_point_world_m
    - surface_outward_normal_world
    - observation_id
    - observed_at_s
    - position_uncertainty_m
  examples:
    - arm_effector_pairs:
        - {arm: CANDIDATE_ARM_A, effector: MATCHED_EFFECTOR_A}
        - {arm: CANDIDATE_ARM_B, effector: MATCHED_EFFECTOR_B}
      contact_point_world_m: [MEASURED_X, MEASURED_Y, MEASURED_Z]
      surface_outward_normal_world: [0, 0, 1]
      preferred_tangent_axis_world: [1, 0, 0]
      approach_distance_m: 0.10
      press_distance_m: 0.03
      observation_id: CURRENT_OBSERVATION_ID
      observed_at_s: CURRENT_OBSERVATION_TIME
      position_uncertainty_m: MEASURED_UNCERTAINTY
annotations:
  read_only: true
  destructive: false
  idempotent: true
  open_world: false
manual: toolbook.yaml
entry: tool.py
timeout_s: 60
requires: intrinsics:kinematics,intrinsics:control,intrinsics:geometry,intrinsics:frames,extrinsics:mount
