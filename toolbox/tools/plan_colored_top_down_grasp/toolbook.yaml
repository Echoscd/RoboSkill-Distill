schema_version: 1
name: plan_colored_top_down_grasp
version: 0.1.0
summary: >-
  Compose colored-object geometry, gripper contracts, TCP compensation, and chained IK into an executable top-down grasp plan.
usage:
  when_to_use:
    - Use when the current task and observation satisfy every field in tool.yaml.
  when_not_to_use:
    - Do not guess missing devices, frames, calibration, geometry, or measurements.
  prerequisites:
    - Read the concise contract in tool.yaml before constructing arguments.
  examples: []
parameters:
  camera:
    meaning: Camera used for the single RGB-D geometry estimate.
    format: Loaded RGB-D device ID string.
    unit: null
    frame: null
    source: Device inventory.
    constraints: [Requires RGB, depth, and world calibration.]
    do_not: [Do not substitute an image path.]
  arm:
    meaning: Arm used for chained IK.
    format: Loaded joint device ID string.
    unit: null
    frame: null
    source: Device inventory.
    constraints: [Must provide read and ik.]
    do_not: [Do not pass a device type.]
  gripper:
    meaning: Mounted parallel-jaw end effector.
    format: Loaded gripper device ID string.
    unit: null
    frame: null
    source: Device inventory and profile.
    constraints: [Must define TCP and legal aperture commands.]
    do_not: [Do not assume normalized open and close values.]
  color:
    meaning: Dominant target color.
    format: Supported color enum.
    unit: null
    frame: null
    source: Task grounding and current observation.
    constraints: [Largest matching component is used.]
    do_not: [Do not use for ambiguous same-color scenes.]
  min_area_px:
    meaning: Segmentation component threshold.
    format: Integer in [20, 10000].
    unit: px
    frame: null
    source: Camera resolution and expected footprint.
    constraints: [Must be below the visible target area.]
    do_not: [Do not express square meters.]
  pregrasp_distance_m:
    meaning: Clearance from grasp to pregrasp.
    format: Number in [0.03, 0.20].
    unit: m
    frame: world vertical
    source: Local clearance policy.
    constraints: [Must exceed expected clutter height.]
    do_not: [Do not use as finger clearance.]
  test_lift_m:
    meaning: Lift distance for post-close verification.
    format: Number in [0.03, 0.15].
    unit: m
    frame: world vertical
    source: Verification policy.
    constraints: [Re-observe after executing it.]
    do_not: [Do not interpret planned lift as proof of grasp.]
  clearance_m:
    meaning: Extra jaw aperture beyond measured object width.
    format: Number in [0.002, 0.04].
    unit: m
    frame: gripper closing axis
    source: Gripper and object geometry.
    constraints: [Open target must remain within gripper aperture limits.]
    do_not: [Do not add it to object height.]
returns:
  summary: Observation-grounded object geometry plus TCP-compensated, chained-IK pregrasp, grasp, and test-lift stages.
failure_handling:
  inspect_order: [tool.yaml, toolbook.yaml, tool.py]
  known_failures: []
  recovery:
    - Re-read the parameter descriptions and verify device IDs, units, and coordinate frames.
    - If the contract is satisfied but the call still fails, inspect the entrypoint and implementation source.
    - Record the failed call in failurebox before changing the tool.
source:
  entrypoint: tool.py
  implementation: [combo.json]
  tests: []
