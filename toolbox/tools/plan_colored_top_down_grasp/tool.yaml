name: plan_colored_top_down_grasp
version: 0.1.0
title: Plan Colored Top Down Grasp
kind: perception
description: >-
  High-level combo for a dominant-color rigid object resting on a horizontal
  support: capture RGB-D once, estimate support-relative object geometry, read
  the gripper contract, and return an IK-checked top-down parallel-jaw pregrasp,
  grasp, and test-lift sequence. Returned poses target the arm flange and already
  compensate the TCP. This plans but does not execute; follow execution_order and
  re-observe after the test lift.
parameters:
  type: object
  additionalProperties: false
  properties:
    camera:
      type: string
    arm:
      type: string
    gripper:
      type: string
    color:
      type: string
      enum: [green, red, blue, yellow, orange, white, black]
    min_area_px:
      type: integer
      minimum: 20
      maximum: 10000
      default: 80
    pregrasp_distance_m:
      type: number
      minimum: 0.03
      maximum: 0.20
      default: 0.10
    test_lift_m:
      type: number
      minimum: 0.03
      maximum: 0.15
      default: 0.06
    clearance_m:
      type: number
      minimum: 0.002
      maximum: 0.04
      default: 0.01
  required: [camera, arm, gripper, color]
annotations:
  read_only: true
  destructive: false
  idempotent: true
  open_world: false
manual: toolbook.yaml
entry: tool.py
timeout_s: 45
device_inputs:
  camera:
    types: [rgbd]
  arm:
    types: [joint]
  gripper:
    types: [gripper]
requires: intrinsics:rgb,intrinsics:depth,intrinsics:kinematics,intrinsics:control,intrinsics:geometry,intrinsics:frames,extrinsics:mount
