name: build_scene_collision_context
version: 0.1.0
title: Build Scene Collision Context
kind: perception
description: >-
  Convert current registered RGB-D observations to world-frame occupied surface
  voxels for check_joint_path_collision or pose planners. Remove active-arm sensor
  returns using synchronized measured joint states and public robot models.
  Save a new context JSON; never overwrite an artifact or move a device.
  Unseen, occluded, filtered and interior space stays unknown, not certified free.
parameters:
  type: object
  additionalProperties: false
  required: [observations, arm_models, output_path, valid_for_s, surface_uncertainty_m, depth_range_m]
  properties:
    observations:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: object
        additionalProperties: false
        required: [camera, depth_path, observation_id, observed_at_s, camera_pose_world]
        properties:
          camera: {type: string, minLength: 1, description: Loaded RGB-D camera ID with matching registered depth calibration.}
          depth_path: {type: string, minLength: 1, description: PGM depth artifact from this exact observation; decoded using the profile encoding and scale.}
          observation_id: {type: string, minLength: 1, description: Actual observation reference, not a fabricated ID.}
          observed_at_s: {type: number, minimum: 0, description: Image acquisition timestamp in current session seconds.}
          camera_pose_world: {type: array, minItems: 7, maxItems: 7, items: {type: number}, description: 'Calibrated camera optical frame in world [x,y,z,qx,qy,qz,qw], meters; transform at image acquisition.'}
    arm_models:
      type: object
      minProperties: 1
      maxProperties: 4
      description: All modeled arm IDs mapped to public URDF and measured joint snapshots synchronized with the images; see manual.
      additionalProperties:
        type: object
        additionalProperties: false
        required: [urdf_path, measured_joints, measured_at_s]
        properties:
          urdf_path: {type: string, minLength: 1, description: Public local robot URDF matching this arm profile; never hidden scene geometry.}
          measured_joints: {type: array, minItems: 1, items: {type: number}, description: Measured radians in profile order at image acquisition.}
          measured_at_s: {type: number, minimum: 0, description: Joint acquisition timestamp in the same session clock.}
    output_path: {type: string, minLength: 1, description: New JSON artifact path in an existing directory; existing files are rejected.}
    valid_for_s: {type: number, exclusiveMinimum: 0, maximum: 30, description: Scene lifetime from the oldest observation in session seconds; refresh after scene changes.}
    surface_uncertainty_m: {type: number, minimum: 0, maximum: 0.05, description: Supplied sensor/calibration error budget in meters; expands occupied voxels and robot-return filtering bounds.}
    depth_range_m: {type: array, minItems: 2, maxItems: 2, items: {type: number}, description: 'Selected optical depth interval [min,max] in meters with 0 < min < max; selection alone does not establish sensor reliability.'}
    voxel_size_m: {type: number, minimum: 0.005, maximum: 0.1, default: 0.02, description: Full side length of world-axis occupancy voxels in meters; no cells are silently dropped.}
    max_snapshot_skew_s: {type: number, minimum: 0, maximum: 1, default: 0.1, description: Largest allowed pairwise camera/joint acquisition time difference in seconds; observations must be during a stationary acquisition.}
    roi_world_m:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min: {type: array, minItems: 3, maxItems: 3, items: {type: number}, description: World-axis ROI lower corner in meters.}
        max: {type: array, minItems: 3, maxItems: 3, items: {type: number}, description: World-axis ROI upper corner in meters; exceeds min on every axis.}
      description: Optional bounded planning region; points outside it are omitted and that space stays unknown.
annotations:
  read_only: true
  destructive: false
  idempotent: false
  open_world: false
manual: toolbook.yaml
entry: tool.py
timeout_s: 60
requires: intrinsics:color,intrinsics:depth,extrinsics:mount
