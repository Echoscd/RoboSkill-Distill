schema_version: 1
name: plan_linear_contact
version: 0.2.0
summary: >-
  Build a four-stage, TCP-compensated, chained-IK plan for a short linear
  contact against a locally planar surface. The tool plans but never executes.
usage:
  when_to_use:
    - A current observation provides a metric contact point and outward surface normal in world coordinates.
    - The desired interaction is a short approach, contact, press, and retreat along the surface normal.
  when_not_to_use:
    - The point is still expressed in a camera frame or its coordinate frame is unknown.
    - The task requires sliding, insertion, force control, deformable contact, or continuous collision checking.
  prerequisites:
    - arm must name a loaded joint device with read and ik actions.
    - effector must declare an arm mount and TCP frame.
    - contact_point_world_m and surface_outward_normal_world must be derived from the same current observation.
    - observation_id must identify the actual observation; never copy an example identifier.
  examples:
    - name: top_down_press
      description: World +Z is upward, so the top surface outward normal is +Z and the derived press direction is -Z.
      arguments:
        arm: right_arm
        effector: right_gripper
        contact_point_world_m: [MEASURED_X, MEASURED_Y, MEASURED_Z]
        surface_outward_normal_world: [0, 0, 1]
        tangent_axis_world: [1, 0, 0]
        approach_distance_m: 0.10
        press_distance_m: 0.03
        observation_id: CURRENT_OBSERVATION_ID
        observed_at_s: CURRENT_OBSERVATION_TIME
        valid_for_s: 5
        position_uncertainty_m: MEASURED_UNCERTAINTY
parameters:
  arm:
    meaning: Joint-space arm that will execute the returned stages.
    format: Loaded Kinex device ID string.
    unit: null
    frame: null
    source: list_device_inventory or the active robot profile.
    constraints: [Device type must be joint, read and ik actions must be available.]
    do_not: [Do not pass a device type such as joint or an unloaded device name.]
  effector:
    meaning: End effector whose TCP is used for contact geometry.
    format: Loaded Kinex device ID string.
    unit: null
    frame: null
    source: list_device_inventory or the active robot profile.
    constraints: [Must declare an extrinsics.mount on arm and intrinsics.frames.tcp.]
    do_not: [Do not substitute the arm flange for the TCP.]
  contact_point_world_m:
    meaning: Desired first-touch point on the contacted surface.
    format: Three finite numbers ordered [x, y, z].
    unit: m
    frame: world
    source: Current calibrated observation transformed through the Kinex frame graph.
    constraints: [Must correspond to observation_id, Must still be valid at planning time.]
    do_not: [Do not pass camera-frame coordinates, pixels, guessed depth, or copied example values.]
  surface_outward_normal_world:
    meaning: Geometric normal pointing from the surface into free space; the planner negates it to obtain press direction.
    format: Three finite numbers; normalization is performed internally.
    unit: dimensionless
    frame: world
    source: Measured or task-grounded local surface geometry from the same observation as the contact point.
    constraints: [Must have nonzero length, Must point outward rather than along desired motion.]
    do_not: [Do not pass the desired press direction.]
  tangent_axis_world:
    meaning: Preferred in-plane axis used to choose the TCP yaw around the contact normal.
    format: Three finite numbers.
    unit: dimensionless
    frame: world
    source: Local surface frame or a deliberate world-axis choice.
    constraints: [Must not be parallel to surface_outward_normal_world.]
    do_not: [Do not use an image-plane axis without transforming it to world.]
  approach_distance_m:
    meaning: Free-space clearance from contact point to approach and retreat points along the outward normal.
    format: Number in [0.03, 0.25].
    unit: m
    frame: null
    source: Task policy and local clearance estimate.
    constraints: [Must exceed press_distance_m.]
    do_not: [Do not use it as total trajectory length.]
  press_distance_m:
    meaning: Travel beyond first contact along the negative outward normal.
    format: Number in [0.002, 0.08].
    unit: m
    frame: null
    source: Mechanism geometry or task-specific contact requirement.
    constraints: [Must be smaller than approach_distance_m.]
    do_not: [Do not infer a large value from visual depth alone.]
  observation_id:
    meaning: Identifier of the observation that produced the contact geometry.
    format: Non-empty string.
    unit: null
    frame: null
    source: Online ObservationRef created for the current camera capture.
    constraints: [Must match contact point, normal, timestamp, and uncertainty.]
    do_not: [Do not invent or copy an identifier from documentation.]
  observed_at_s:
    meaning: Timestamp of the source observation on the active session clock.
    format: Non-negative number.
    unit: s
    frame: session clock
    source: The same ObservationRef as observation_id.
    constraints: [Must use the harness clock rather than wall-clock time.]
    do_not: [Do not replace with the current time after perception.]
  valid_for_s:
    meaning: Maximum age allowed before the plan is considered stale.
    format: Number in (0, 30].
    unit: s
    frame: session clock
    source: Task policy based on scene dynamics.
    constraints: [Re-observe after any scene-changing action regardless of remaining time.]
    do_not: [Do not extend validity to avoid another observation.]
  position_uncertainty_m:
    meaning: Conservative positional uncertainty of the world-frame contact point.
    format: Number in [0, 0.05].
    unit: m
    frame: world
    source: Perception or calibration uncertainty associated with observation_id.
    constraints: [Must describe the same estimate as contact_point_world_m.]
    do_not: [Do not set zero unless the measurement system explicitly reports it.]
returns:
  plan_id: Unique identifier for the generated plan.
  based_on: Observation IDs that ground the plan.
  expires_at_s: Session-clock expiration time.
  directions: Normalized outward, approach, and press vectors in world coordinates.
  flange_poses: Seven-value [x, y, z, qx, qy, qz, qw] targets in world coordinates for approach, contact, press, and retreat.
  joint_stages: Chained IK solutions in execution order; these are plans, not execution receipts.
  warning: Remaining checks that this discrete IK planner does not perform.
failure_handling:
  inspect_order: [tool.yaml, toolbook.yaml, tool.py, core.py]
  known_failures:
    - code: FRAME_MISMATCH
      symptom: IK is unreachable even though the pixel detection is plausible.
      cause: A camera-frame point was passed as contact_point_world_m.
    - code: STALE_OBSERVATION
      symptom: The plan points to the old object pose after the scene moved.
      cause: The observation expired or was reused after an action.
    - code: IK_UNREACHABLE
      symptom: One of the four chained IK stages has no solution.
      cause: The target, orientation, clearance, or press depth is infeasible.
  recovery:
    - Confirm the contact point is transformed to world and bound to the current observation.
    - Re-observe after any scene-changing action; do not repair geometry by guessing coordinates.
    - Inspect core.py only after the interface and frame provenance have been verified.
    - Record the exact failed arguments and trace in failurebox before changing planner behavior.
source:
  entrypoint: tool.py
  implementation: [core.py]
  tests: [test_core.py]
