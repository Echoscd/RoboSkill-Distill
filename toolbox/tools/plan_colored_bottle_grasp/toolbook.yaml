schema_version: 1
name: plan_colored_bottle_grasp
version: 0.1.0
summary: >-
  Generate an IK-checked top-down grasp sequence for a color-described bottle lying on a support surface.
usage:
  when_to_use:
    - Use when the current task and observation satisfy every field in tool.yaml.
  when_not_to_use:
    - Do not guess missing devices, frames, calibration, geometry, or measurements.
  prerequisites:
    - Read the concise contract in tool.yaml before constructing arguments.
  examples: []
parameters:
  camera:
    meaning: Camera used to observe and segment the bottle.
    format: Loaded RGB-D device ID string.
    unit: null
    frame: null
    source: Device inventory.
    constraints: [Must be calibrated and mounted in world.]
    do_not: [Do not reuse a stale capture after scene motion.]
  arm:
    meaning: Arm for chained IK planning.
    format: Loaded joint device ID string.
    unit: null
    frame: null
    source: Device inventory.
    constraints: [Must provide read and ik.]
    do_not: [Do not pass joint as a device ID.]
  gripper:
    meaning: Parallel-jaw gripper mounted on arm.
    format: Loaded gripper device ID string.
    unit: null
    frame: null
    source: Device inventory and mount profile.
    constraints: [Must define control bounds, geometry, mount, and TCP.]
    do_not: [Do not guess gripper commands.]
  color:
    meaning: Dominant visible bottle color.
    format: Supported color enum.
    unit: null
    frame: null
    source: Task description and RGB observation.
    constraints: [Bottle must be separable by color.]
    do_not: [Do not use when same-color distractors dominate.]
  pregrasp_distance_m:
    meaning: Vertical clearance above the planned grasp point.
    format: Number in [0.03, 0.20].
    unit: m
    frame: world vertical
    source: Task clearance policy.
    constraints: [Must allow collision-free approach.]
    do_not: [Do not treat as grasp depth.]
  test_lift_m:
    meaning: Vertical lift after closing used to test the grasp.
    format: Number in [0.03, 0.15].
    unit: m
    frame: world vertical
    source: Verification policy.
    constraints: [Must be large enough for visual displacement evidence.]
    do_not: [Do not claim success from the lift command alone.]
returns:
  summary: IK-checked world-frame flange stages, legal gripper open and close targets, measured bottle geometry, and execution order.
failure_handling:
  inspect_order: [tool.yaml, toolbook.yaml, tool.py]
  known_failures: []
  recovery:
    - Re-read the parameter descriptions and verify device IDs, units, and coordinate frames.
    - If the contract is satisfied but the call still fails, inspect the entrypoint and implementation source.
    - Record the failed call in failurebox before changing the tool.
source:
  entrypoint: tool.py
  implementation: []
  tests: []
