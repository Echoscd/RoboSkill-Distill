name: wait_for_joint_arrival
version: 0.1.0
title: Wait for Joint Arrival
kind: perception
description: >-
  Poll measured joints after a non-blocking Servo submission until the exact
  target is reached, a device fault appears, or a wall-clock timeout expires.
  Returns measured evidence and never claims physical contact or task success.
  This tool performs no motion and does not stop the device on timeout.
parameters:
  type: object
  additionalProperties: false
  properties:
    arm:
      type: string
      description: Loaded joint device ID that received block=false Servo.
    target_joints:
      type: array
      minItems: 1
      items: {type: number}
      description: Exact joint target passed to Servo, in profile joint order and radians.
    tolerance_rad:
      type: number
      exclusiveMinimum: 0
      maximum: 0.2
      default: 0.02
      description: Maximum allowed absolute error for every joint.
    timeout_wall_s:
      type: number
      exclusiveMinimum: 0
      maximum: 120
      default: 60
      description: Maximum real wall-clock seconds to poll; independent of simulator speed.
    poll_interval_s:
      type: number
      minimum: 0.1
      maximum: 5
      default: 0.5
      description: Real wall-clock seconds between measured joint reads.
    stable_samples:
      type: integer
      minimum: 1
      maximum: 5
      default: 2
      description: Consecutive within-tolerance samples required for reached=true.
  required: [arm, target_joints]
  examples:
    - arm: left_arm
      target_joints: [TARGET_J1, TARGET_J2, TARGET_J3, TARGET_J4, TARGET_J5, TARGET_J6]
      tolerance_rad: 0.02
      timeout_wall_s: 60
annotations:
  read_only: true
  destructive: false
  idempotent: false
  open_world: false
manual: toolbook.yaml
entry: tool.py
timeout_s: 130
device_inputs:
  arm: {types: [joint]}
requires: intrinsics:feedback
