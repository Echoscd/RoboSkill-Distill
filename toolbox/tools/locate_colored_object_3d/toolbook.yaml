schema_version: 1
name: locate_colored_object_3d
version: 0.1.0
summary: >-
  Locate a dominant-color object in calibrated RGB-D and estimate its visible three-dimensional geometry.
usage:
  when_to_use:
    - Use when the current task and observation satisfy every field in tool.yaml.
  when_not_to_use:
    - Do not guess missing devices, frames, calibration, geometry, or measurements.
  prerequisites:
    - Read the concise contract in tool.yaml before constructing arguments.
  examples: []
parameters:
  camera:
    meaning: RGB-D camera that produces the color and depth observation.
    format: Loaded Kinex device ID string.
    unit: null
    frame: null
    source: Device inventory and robot profile.
    constraints: [Requires calibrated RGB, registered metric depth, and world mount.]
    do_not: [Do not pass the literal device type rgbd.]
  color:
    meaning: Dominant visible target color.
    format: One supported color enum value.
    unit: null
    frame: null
    source: Task grounding and current RGB frame.
    constraints: [The largest retained component is selected.]
    do_not: [Do not assume semantic identity from color alone when multiple objects match.]
  min_area_px:
    meaning: Small-component rejection threshold.
    format: Integer greater than or equal to 20.
    unit: px
    frame: null
    source: Camera resolution and expected target footprint.
    constraints: [Must remain below the target visible area.]
    do_not: [Do not express metric area here.]
returns:
  summary: Mask geometry, robust depth statistics, and 3D points in both camera optical and world frames with capture provenance.
failure_handling:
  inspect_order: [tool.yaml, toolbook.yaml, tool.py]
  known_failures: []
  recovery:
    - Re-read the parameter descriptions and verify device IDs, units, and coordinate frames.
    - If the contract is satisfied but the call still fails, inspect the entrypoint and implementation source.
    - Record the failed call in failurebox before changing the tool.
source:
  entrypoint: tool.py
  implementation: [color_geometry.py]
  tests: []
