name: plan_top_down_parallel_grasp
version: 0.1.0
title: Plan Top Down Parallel Grasp
kind: perception
description: >-
  Convert explicit world-frame object center and horizontal footprint geometry
  into an IK-checked top-down parallel-jaw pregrasp, grasp, and test-lift plan.
  It reads the gripper contract, respects aperture bounds and geometry axes,
  compensates the TCP offset, and tests multiple wrist yaws. It is object-class
  agnostic and performs no perception or motion execution.
parameters:
  type: object
  additionalProperties: false
  properties:
    arm:
      type: string
    gripper:
      type: string
    object_center_world_m:
      type: array
      items: {type: number}
      minItems: 3
      maxItems: 3
    major_axis_world_xy:
      type: array
      items: {type: number}
      minItems: 2
      maxItems: 2
    major_extent_m:
      type: number
      exclusiveMinimum: 0
      maximum: 0.40
    minor_extent_m:
      type: number
      exclusiveMinimum: 0
      maximum: 0.25
    pregrasp_distance_m:
      type: number
      minimum: 0.03
      maximum: 0.20
      default: 0.10
    test_lift_m:
      type: number
      minimum: 0.03
      maximum: 0.15
      default: 0.06
    clearance_m:
      type: number
      minimum: 0.002
      maximum: 0.04
      default: 0.01
  required: [arm, gripper, object_center_world_m, major_axis_world_xy, major_extent_m, minor_extent_m]
annotations:
  read_only: true
  destructive: false
  idempotent: true
  open_world: false
manual: toolbook.yaml
entry: tool.py
timeout_s: 30
device_inputs:
  arm:
    types: [joint]
  gripper:
    types: [gripper]
requires: intrinsics:kinematics,intrinsics:control,intrinsics:geometry,intrinsics:frames,extrinsics:mount
